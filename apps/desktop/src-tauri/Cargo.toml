[package]
name = "app"
version = "0.3.0"
description = "Haptic — local-first markdown notes"
authors = ["Alejandro (fork of chroxify/haptic)"]
license = "AGPL-3.0"
repository = "https://github.com/strastdas/haptic"
default-run = "app"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
regex = "1"
hex_color = "3"
# Correct OS trash semantics on all three platforms (Recycle Bin / freedesktop
# .trashinfo / macOS Finder trash) — see commands/trash.rs.
trash = "5"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"

# MacOS dependencies (window styling in src/mac/window.rs)
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
