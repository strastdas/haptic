[package]
name = "app"
version = "0.1.0"
description = "Haptic — local-first markdown notes"
authors = ["Alejandro (fork of chroxify/haptic)"]
license = "AGPL-3.0"
repository = "https://github.com/strastdas/haptic"
default-run = "app"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
regex = "1"
hex_color = "3"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"

# MacOS dependencies (window styling in src/mac/window.rs)
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
